image: debian:trixie

build:
  script: |
    set -exu
    apt-get update
    apt-get --yes install --no-install-recommends gcc-aarch64-linux-gnu build-essential bison flex device-tree-compiler git ca-certificates libssl-dev bc python3 python3-setuptools swig libpython3-dev python3-pyelftools uuid-dev libgnutls28-dev
    ./build.sh
  artifacts:
    paths:
      - images/barebox-mnt-pocket-reform-rk3588.img
      - images/barebox-mnt-reform-next-rk3588.img
      - images/barebox-mnt-reform2-rk3588.img
      - images/barebox-mnt-reform2-dsi-rk3588.img
