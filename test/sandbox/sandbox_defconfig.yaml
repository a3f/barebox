targets:
  main:
    drivers:
      ExternalConsoleDriver:
        cmd: !template "$LG_BUILDDIR/barebox"
        txdelay: 0.05
      BareboxDriver:
        prompt: 'barebox@[^:]+:[^ ]+ '
        bootstring: 'commandline:'
      ExternalPowerDriver:
        cmd_on: 'true'
        cmd_off: 'true'
        cmd_cycle: 'true'
      BareboxTestStrategy: {}
    runner:
      tuxmake_arch: um
imports:
  -  ../strategy.py
